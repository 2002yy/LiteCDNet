name: Checkpoint safety

on:
  pull_request:
    branches: [master]
    paths:
      - "src/models/checkpoint_io.py"
      - "src/models/trainer.py"
      - "src/models/evaluator.py"
      - "tests/test_checkpoint_io.py"
      - ".github/workflows/checkpoint-safety.yml"
  push:
    branches: [master]
    paths:
      - "src/models/checkpoint_io.py"
      - "src/models/trainer.py"
      - "src/models/evaluator.py"
      - "tests/test_checkpoint_io.py"
      - ".github/workflows/checkpoint-safety.yml"

permissions:
  contents: read

jobs:
  cpu-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and NumPy
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile checkpoint surface
        run: python -m py_compile src/models/checkpoint_io.py src/models/trainer.py src/models/evaluator.py tests/test_checkpoint_io.py
      - name: Test safe and atomic checkpoint contract
        run: python -m unittest discover -s tests -p test_checkpoint_io.py -v
