name: Python source and dataset contracts

on:
  push:
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/data-paths.yml'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/data-paths.yml'

permissions:
  contents: read

jobs:
  data-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax for all source and test modules
        run: python -m compileall -q src tests
      - name: Check dataset root contracts (stdlib only)
        run: python -m unittest discover -s tests -p 'test_data_config.py' -v
